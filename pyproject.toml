[project]
name = "agent-action-tiers"
version = "0.1.0"
description = "Read, act, spend: risk tiers for AI agent actions, with a policy gate and a hash-chained audit log."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Venkatesan Ramachandran" }]
dependencies = []

[project.scripts]
action-tiers = "action_tiers.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/action_tiers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
